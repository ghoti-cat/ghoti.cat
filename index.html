<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="A school of ghoti.">
    <title>ghoti.cat</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300&amp;display=swap">
    <link rel="stylesheet" href="style.css">
    <script>
      if (document.fonts) {
        document.documentElement.classList.add("fonts-loading");
      }
    </script>
  </head>
  <body>
    <main class="ocean">
      <div class="school-frame">
        <img class="school" src="school.svg" width="1350" height="540"
          draggable="false" fetchpriority="high">
      </div>
      <p class="proverb" lang="ca">Moltes voltes està el peix al plat per falta de gat.</p>
    </main>
    <script>
      if (document.fonts) {
        const showProverb = () => document.documentElement.classList.remove("fonts-loading");
        document.fonts.load('300 36px "Noto Sans"', document.querySelector(".proverb").textContent)
          .then(showProverb, showProverb);
      }
    </script>
  </body>
</html>
